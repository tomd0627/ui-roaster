  <text x="548" y="528" font-family="Inter, Arial" font-size="13" fill="#1a1a1a" font-weight="500">Mobile Banking App</text>
  <text x="548" y="548" font-family="Inter, Arial" font-size="11" fill="#888">2023</text>
