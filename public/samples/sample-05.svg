<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Typography nightmare: too many fonts, sizes, colors, weights -->
  <rect width="800" height="600" fill="#fffef2"/>
  <!-- Header: multiple fonts, no hierarchy -->
  <text x="400" y="60" font-family="Comic Sans MS, cursive" font-size="36" fill="#ff0000" text-anchor="middle" font-weight="bold">Welcome to MY Blog!! 😊😊😊</text>
  <text x="400" y="85" font-family="Times New Roman" font-size="14" fill="#0000ff" text-anchor="middle" font-style="italic">- where I share my AMAZING thoughts about things -</text>
  <!-- Decorative divider -->
  <text x="400" y="100" font-family="Arial" font-size="12" fill="#ff00ff" text-anchor="middle">✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦✦</text>
  <!-- Post title: all caps, HUGE, clashing colors -->
  <text x="50" y="140" font-family="Impact, Arial Black" font-size="42" fill="#FF6600">MY REVIEW OF THE NEW</text>
  <text x="50" y="185" font-family="Papyrus, fantasy" font-size="38" fill="#9900CC">COFFEE MAKER!!! ☕</text>
  <!-- Meta: tiny, invisible contrast -->
  <text x="50" y="208" font-family="Arial" font-size="10" fill="#cccccc">Posted by: blogmaster2004 | Date: sometime last month | Category: STUFF | Views: a lot</text>
  <!-- Body: mixed fonts every sentence -->
  <text x="50" y="240" font-family="Arial" font-size="15" fill="#000000">So I got this AMAZING new coffee maker last week and</text>
  <text x="50" y="260" font-family="Times New Roman" font-size="18" fill="#333399" font-style="italic">I have so many thoughts about it that I wanted to share</text>
  <text x="50" y="283" font-family="Courier New" font-size="13" fill="#006600">with everyone who reads this blog (hi mom!)</text>
  <text x="50" y="308" font-family="Comic Sans MS" font-size="16" fill="#CC0000">First of all: IT MAKES COFFEE!! Which is literally</text>
  <text x="50" y="330" font-family="Verdana" font-size="14" fill="#996600">exactly what I wanted it to do. Five stars already.</text>
  <!-- Centered + justified + no consistency -->
  <text x="400" y="360" font-family="Arial" font-size="22" fill="#FF0066" text-anchor="middle" font-weight="bold">★★★★★ PROS ★★★★★</text>
  <text x="400" y="385" font-family="Comic Sans MS" font-size="14" fill="#006699" text-anchor="middle">• Makes coffee (HUGE pro)</text>
  <text x="400" y="405" font-family="Times New Roman" font-size="16" fill="#009900" text-anchor="middle" font-style="italic">• Has a button (very important)</text>
  <text x="400" y="425" font-family="Courier" font-size="12" fill="#330099" text-anchor="middle">• Beeps when done (startling but informative)</text>
  <!-- Random highlighting -->
  <rect x="46" y="445" width="708" height="25" fill="#ffff00"/>
  <text x="400" y="462" font-family="Impact" font-size="18" fill="#ff0000" text-anchor="middle">IMPORTANT NOTE: I AM NOT A PROFESSIONAL REVIEWER</text>
  <!-- Comments section: chaos -->
  <text x="50" y="500" font-family="Arial Black" font-size="20" fill="#CC00CC">17 COMMENTS!!!</text>
  <text x="50" y="525" font-family="Arial" font-size="11" fill="#0000ff" text-decoration="underline">Anonymous says:</text>
  <text x="50" y="542" font-family="Times" font-size="13" fill="#333">"great post!!!!! more coffee reviews plz!!!!"</text>
  <text x="50" y="565" font-family="Arial" font-size="11" fill="#0000ff" text-decoration="underline">CoffeeLover99 says:</text>
  <text x="50" y="582" font-family="Comic Sans MS" font-size="12" fill="#996600">"which brand is it??? I need to know ASAP"</text>
</svg>
