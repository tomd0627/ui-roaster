<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Confusing mobile app onboarding: too many steps, unclear progress -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  <!-- Phone frame -->
  <rect x="260" y="20" width="280" height="560" rx="30" fill="#1a1a1a"/>
  <rect x="270" y="50" width="260" height="500" fill="#ffffff"/>
  <!-- Notch -->
  <rect x="330" y="28" width="140" height="20" rx="10" fill="#0a0a0a"/>
  <!-- Step indicator: confusing, no clear current position -->
  <circle cx="310" cy="75" r="10" fill="#007bff"/>
  <text x="310" y="79" font-family="Arial" font-size="9" fill="white" text-anchor="middle">1</text>
  <line x1="320" y1="75" x2="345" y2="75" stroke="#ccc" stroke-width="2"/>
  <circle cx="355" cy="75" r="10" fill="#ccc"/>
  <text x="355" y="79" font-family="Arial" font-size="9" fill="white" text-anchor="middle">2</text>
  <line x1="365" y1="75" x2="390" y2="75" stroke="#ccc" stroke-width="2"/>
  <circle cx="400" cy="75" r="10" fill="#ccc"/>
  <text x="400" y="79" font-family="Arial" font-size="9" fill="white" text-anchor="middle">3</text>
  <line x1="410" y1="75" x2="435" y2="75" stroke="#ccc" stroke-width="2"/>
  <circle cx="445" cy="75" r="10" fill="#ccc"/>
  <text x="445" y="79" font-family="Arial" font-size="9" fill="white" text-anchor="middle">4</text>
  <line x1="455" y1="75" x2="480" y2="75" stroke="#ccc" stroke-width="2"/>
  <circle cx="490" cy="75" r="10" fill="#ccc"/>
  <text x="490" y="79" font-family="Arial" font-size="9" fill="white" text-anchor="middle">5</text>
  <!-- 5 step dots is too many for mobile - text says step 1 of 12 -->
  <text x="400" y="100" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">Step 1 of 12</text>
  <!-- Screen content: vague -->
  <text x="400" y="140" font-family="Arial" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Let&apos;s get started!</text>
  <text x="400" y="162" font-family="Arial" font-size="11" fill="#666" text-anchor="middle">Tell us a bit about yourself</text>
  <!-- Form fields: too small touch targets -->
  <rect x="280" y="180" width="240" height="32" rx="4" fill="white" stroke="#ddd"/>
  <text x="290" y="200" font-family="Arial" font-size="10" fill="#aaa">First name</text>
  <rect x="280" y="220" width="240" height="32" rx="4" fill="white" stroke="#ddd"/>
  <text x="290" y="240" font-family="Arial" font-size="10" fill="#aaa">Last name</text>
  <rect x="280" y="260" width="240" height="32" rx="4" fill="white" stroke="#ddd"/>
  <text x="290" y="280" font-family="Arial" font-size="10" fill="#aaa">Email address</text>
  <rect x="280" y="300" width="240" height="32" rx="4" fill="white" stroke="#ddd"/>
  <text x="290" y="320" font-family="Arial" font-size="10" fill="#aaa">Phone number (optional)</text>
  <rect x="280" y="340" width="240" height="32" rx="4" fill="white" stroke="#ddd"/>
  <text x="290" y="360" font-family="Arial" font-size="10" fill="#aaa">Date of birth</text>
  <rect x="280" y="380" width="240" height="32" rx="4" fill="white" stroke="#ddd"/>
  <text x="290" y="400" font-family="Arial" font-size="10" fill="#aaa">Company name (optional)</text>
  <!-- Tiny legal text -->
  <text x="400" y="430" font-family="Arial" font-size="7" fill="#bbb" text-anchor="middle">By continuing you agree to our Terms of Service,</text>
  <text x="400" y="442" font-family="Arial" font-size="7" fill="#bbb" text-anchor="middle">Privacy Policy, Cookie Policy, Data Processing Agreement,</text>
  <text x="400" y="454" font-family="Arial" font-size="7" fill="#bbb" text-anchor="middle">End User License Agreement, and Acceptable Use Policy.</text>
  <!-- Two same-weight buttons -->
  <rect x="285" y="465" width="110" height="36" rx="18" fill="white" stroke="#007bff" stroke-width="1.5"/>
  <text x="340" y="487" font-family="Arial" font-size="12" fill="#007bff" text-anchor="middle">Skip for now</text>
  <rect x="405" y="465" width="110" height="36" rx="18" fill="#007bff"/>
  <text x="460" y="487" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Continue</text>
  <!-- "What is this app for" label beside the phone -->
  <text x="50" y="200" font-family="Arial" font-size="13" fill="#666" font-weight="bold">Issues:</text>
  <text x="50" y="225" font-family="Arial" font-size="11" fill="#888">• 12 steps of onboarding</text>
  <text x="50" y="244" font-family="Arial" font-size="11" fill="#888">• Tiny 32px touch targets</text>
  <text x="50" y="263" font-family="Arial" font-size="11" fill="#888">• 7px legal text</text>
  <text x="50" y="282" font-family="Arial" font-size="11" fill="#888">• Unclear primary action</text>
  <text x="50" y="301" font-family="Arial" font-size="11" fill="#888">• 6 fields on one screen</text>
  <text x="600" y="200" font-family="Arial" font-size="13" fill="#666" font-weight="bold">No clear:</text>
  <text x="600" y="225" font-family="Arial" font-size="11" fill="#888">• App name/purpose</text>
  <text x="600" y="244" font-family="Arial" font-size="11" fill="#888">• Progress indicator</text>
  <text x="600" y="263" font-family="Arial" font-size="11" fill="#888">• Skip all option</text>
  <text x="600" y="282" font-family="Arial" font-size="11" fill="#888">• Back navigation</text>
</svg>
