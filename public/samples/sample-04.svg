<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- E-commerce product page: busy, bad hierarchy, too many CTAs -->
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Header: cluttered -->
  <rect width="800" height="90" fill="#ff6600"/>
  <text x="15" y="35" font-family="Arial" font-size="22" fill="white" font-weight="bold">MEGADEALS.COM</text>
  <text x="15" y="55" font-family="Arial" font-size="10" fill="white">FREE SHIPPING ON ORDERS OVER $25 | USE CODE SAVE20 FOR 20% OFF | LIMITED TIME OFFER!</text>
  <!-- Search bar -->
  <rect x="200" y="15" width="300" height="35" fill="white" stroke="white" stroke-width="2"/>
  <text x="210" y="38" font-family="Arial" font-size="13" fill="#999">Search 2 million+ products...</text>
  <rect x="500" y="15" width="70" height="35" fill="#FFD700"/>
  <text x="525" y="38" font-family="Arial" font-size="13" fill="black" font-weight="bold">GO</text>
  <!-- Cart icon -->
  <text x="620" y="55" font-family="Arial" font-size="11" fill="white">ACCOUNT | ORDERS | CART (3)</text>
  <!-- Nav: too many categories -->
  <rect y="90" width="800" height="30" fill="#232f3e"/>
  <text x="10" y="110" font-family="Arial" font-size="10" fill="white">All | Electronics | Clothing | Home | Garden | Sports | Beauty | Books | Toys | Automotive | Pet Supplies | Grocery | Office</text>
  <!-- Breadcrumb: too long -->
  <text x="10" y="140" font-family="Arial" font-size="9" fill="#0066c0">Home > Electronics > Computers > Laptops > Windows Laptops > 15-16 inch > Under $1000 > Best Sellers</text>
  <!-- Product section -->
  <!-- Image area -->
  <rect x="10" y="150" width="280" height="280" fill="#f0f0f0" stroke="#ddd"/>
  <text x="150" y="295" font-family="Arial" font-size="12" fill="#999" text-anchor="middle">[Product Image]</text>
  <text x="150" y="315" font-family="Arial" font-size="9" fill="#ccc" text-anchor="middle">Click to zoom</text>
  <!-- Thumbnail strip -->
  <rect x="10" y="440" width="55" height="40" fill="#eee" stroke="#0066c0" stroke-width="2"/>
  <rect x="75" y="440" width="55" height="40" fill="#eee" stroke="#ddd"/>
  <rect x="140" y="440" width="55" height="40" fill="#eee" stroke="#ddd"/>
  <rect x="205" y="440" width="55" height="40" fill="#eee" stroke="#ddd"/>
  <!-- Product info: badly typeset -->
  <rect x="300" y="150" width="490" height="420" fill="white"/>
  <text x="310" y="170" font-family="Arial" font-size="10" fill="#0066c0">Visit the AcmeTech Store</text>
  <text x="310" y="192" font-family="Arial" font-size="13" fill="black" font-weight="bold">AcmeTech ProBook 15.6" Laptop Computer - Intel Core i7, 16GB RAM, 512GB SSD, Windows 11 Home, Backlit Keyboard, Wi-Fi 6, Bluetooth 5.0, USB-C, HDMI, Silver</text>
  <!-- Star rating: hard to read -->
  <text x="310" y="218" font-family="Arial" font-size="12" fill="#ff9900">★★★★☆</text>
  <text x="375" y="218" font-family="Arial" font-size="12" fill="#0066c0">4.3 out of 5 stars</text>
  <text x="440" y="218" font-family="Arial" font-size="12" fill="#0066c0">| 2,847 ratings</text>
  <!-- Confusing pricing -->
  <text x="310" y="242" font-family="Arial" font-size="10" fill="#565959">List Price: </text>
  <text x="380" y="242" font-family="Arial" font-size="10" fill="#565959" text-decoration="line-through">$1,299.99</text>
  <text x="310" y="260" font-family="Arial" font-size="10" fill="#B12704">You Save: $300.00 (23%)</text>
  <text x="310" y="285" font-family="Arial" font-size="24" fill="#B12704" font-weight="bold">$999<text font-size="14" dy="-8">.99</text></text>
  <text x="310" y="305" font-family="Arial" font-size="10" fill="#007600">In Stock.</text>
  <!-- Too many CTAs, same visual weight -->
  <rect x="310" y="320" width="200" height="40" rx="3" fill="#FFD814"/>
  <text x="410" y="345" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Add to Cart</text>
  <rect x="310" y="368" width="200" height="40" rx="3" fill="#FFA41C"/>
  <text x="410" y="393" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle">Buy Now</text>
  <rect x="310" y="415" width="200" height="32" rx="3" fill="#f0f0f0" stroke="#ccc"/>
  <text x="410" y="436" font-family="Arial" font-size="11" text-anchor="middle">Add to Wish List</text>
  <rect x="310" y="452" width="200" height="32" rx="3" fill="#f0f0f0" stroke="#ccc"/>
  <text x="410" y="473" font-family="Arial" font-size="11" text-anchor="middle">Add to Compare</text>
  <!-- Side panel: more noise -->
  <rect x="520" y="320" width="260" height="240" fill="#f7f7f7" stroke="#ddd"/>
  <text x="530" y="345" font-family="Arial" font-size="11" fill="black" font-weight="bold">Ships to: United States</text>
  <text x="530" y="365" font-family="Arial" font-size="10" fill="black">FREE Delivery Thursday, Nov 14</text>
  <text x="530" y="382" font-family="Arial" font-size="10" fill="#0066c0">Details</text>
  <text x="530" y="410" font-family="Arial" font-size="10" fill="black">Or fastest delivery Tomorrow, Nov 13</text>
  <text x="530" y="430" font-family="Arial" font-size="9" fill="#565959">Order within 4 hrs 23 mins</text>
  <text x="530" y="450" font-family="Arial" font-size="9" fill="#0066c0">Select delivery location</text>
  <text x="530" y="480" font-family="Arial" font-size="10" fill="#007600">In Stock</text>
  <text x="530" y="500" font-family="Arial" font-size="9" fill="#565959">Qty: 1 ▼</text>
  <!-- Footer promo bar -->
  <rect y="570" width="800" height="30" fill="#37475A"/>
  <text x="400" y="590" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Back to top | © 2024 MegaDeals.com, Inc. or its affiliates | Conditions | Privacy | Cookie Policy</text>
</svg>
