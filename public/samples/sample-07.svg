<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Dark mode SaaS: decent design but issues with contrast and spacing -->
  <rect width="800" height="600" fill="#0f172a"/>
  <!-- Sidebar nav -->
  <rect width="220" height="600" fill="#1e293b"/>
  <!-- Logo -->
  <circle cx="30" cy="36" r="14" fill="#6366f1"/>
  <text x="55" y="42" font-family="Inter, Arial" font-size="15" fill="white" font-weight="600">Nexflow</text>
  <!-- Nav items -->
  <rect x="12" y="68" width="196" height="38" rx="8" fill="#6366f1" opacity="0.2"/>
  <rect x="20" y="78" width="18" height="18" rx="3" fill="#6366f1"/>
  <text x="46" y="92" font-family="Inter, Arial" font-size="13" fill="#6366f1" font-weight="500">Dashboard</text>
  <rect x="20" y="118" width="18" height="18" rx="3" fill="#475569"/>
  <text x="46" y="132" font-family="Inter, Arial" font-size="13" fill="#64748b">Projects</text>
  <rect x="20" y="158" width="18" height="18" rx="3" fill="#475569"/>
  <text x="46" y="172" font-family="Inter, Arial" font-size="13" fill="#64748b">Analytics</text>
  <rect x="20" y="198" width="18" height="18" rx="3" fill="#475569"/>
  <text x="46" y="212" font-family="Inter, Arial" font-size="13" fill="#64748b">Team</text>
  <rect x="20" y="238" width="18" height="18" rx="3" fill="#475569"/>
  <text x="46" y="252" font-family="Inter, Arial" font-size="13" fill="#64748b">Settings</text>
  <!-- Contrast issue: muted nav labels barely readable -->
  <text x="12" y="300" font-family="Inter, Arial" font-size="9" fill="#334155" font-weight="600">WORKSPACE</text>
  <text x="46" y="325" font-family="Inter, Arial" font-size="12" fill="#334155">Marketing Q4</text>
  <text x="46" y="348" font-family="Inter, Arial" font-size="12" fill="#334155">Product Launch</text>
  <text x="46" y="371" font-family="Inter, Arial" font-size="12" fill="#334155">Dev Sprint 23</text>
  <!-- Top bar -->
  <rect x="220" y="0" width="580" height="56" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
