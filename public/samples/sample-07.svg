  <rect x="235" y="72" width="168" height="90" rx="10" fill="#1e293b"/>
  <text x="252" y="98" font-family="Inter, Arial" font-size="10" fill="#64748b">Total Revenue</text>
  <text x="252" y="125" font-family="Inter, Arial" font-size="22" fill="white" font-weight="700">$48,295</text>
  <text x="252" y="148" font-family="Inter, Arial" font-size="11" fill="#22c55e">↑ 12.5% this month</text>
  <rect x="415" y="72" width="168" height="90" rx="10" fill="#1e293b"/>
  <text x="432" y="98" font-family="Inter, Arial" font-size="10" fill="#64748b">Active Users</text>
  <text x="432" y="125" font-family="Inter, Arial" font-size="22" fill="white" font-weight="700">2,847</text>
  <text x="432" y="148" font-family="Inter, Arial" font-size="11" fill="#ef4444">↓ 3.2% this month</text>
  <rect x="595" y="72" width="168" height="90" rx="10" fill="#1e293b"/>
  <text x="612" y="98" font-family="Inter, Arial" font-size="10" fill="#64748b">Conversion</text>
  <text x="612" y="125" font-family="Inter, Arial" font-size="22" fill="white" font-weight="700">4.2%</text>
  <text x="612" y="148" font-family="Inter, Arial" font-size="11" fill="#22c55e">↑ 0.8% this month</text>
