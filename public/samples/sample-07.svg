  <!-- Fake bar chart -->
  <rect x="252" y="300" width="24" height="80" fill="#6366f1" opacity="0.7" rx="3"/>
  <rect x="287" y="270" width="24" height="110" fill="#6366f1" opacity="0.7" rx="3"/>
  <rect x="322" y="285" width="24" height="95" fill="#6366f1" opacity="0.7" rx="3"/>
  <rect x="357" y="255" width="24" height="125" fill="#6366f1" opacity="0.7" rx="3"/>
  <rect x="392" y="240" width="24" height="140" fill="#6366f1" opacity="0.7" rx="3"/>
  <rect x="427" y="260" width="24" height="120" fill="#6366f1" opacity="0.7" rx="3"/>
  <rect x="462" y="230" width="24" height="150" fill="#6366f1" rx="3"/>
  <rect x="497" y="250" width="24" height="130" fill="#6366f1" opacity="0.7" rx="3"/>
  <rect x="532" y="235" width="24" height="145" fill="#6366f1" opacity="0.7" rx="3"/>
  <!-- Right panel -->
  <rect x="607" y="178" width="156" height="220" rx="10" fill="#1e293b"/>
  <text x="622" y="202" font-family="Inter, Arial" font-size="13" fill="white" font-weight="600">Recent Activity</text>
  <text x="622" y="230" font-family="Inter, Arial" font-size="10" fill="#64748b">Sarah approved budget</text>
  <text x="622" y="246" font-family="Inter, Arial" font-size="9" fill="#334155">2 hours ago</text>
  <text x="622" y="270" font-family="Inter, Arial" font-size="10" fill="#64748b">New project created</text>
  <text x="622" y="286" font-family="Inter, Arial" font-size="9" fill="#334155">5 hours ago</text>
  <text x="622" y="310" font-family="Inter, Arial" font-size="10" fill="#64748b">Invoice #4521 paid</text>
  <text x="622" y="326" font-family="Inter, Arial" font-size="9" fill="#334155">Yesterday</text>
  <!-- Bottom table: inconsistent with cards above -->
  <rect x="235" y="415" width="528" height="165" rx="10" fill="#1e293b"/>
  <text x="252" y="440" font-family="Inter, Arial" font-size="13" fill="white" font-weight="600">Recent Transactions</text>
  <!-- Table headers: same color as content -->
  <text x="252" y="462" font-family="Inter, Arial" font-size="10" fill="#475569">ID</text>
  <text x="300" y="462" font-family="Inter, Arial" font-size="10" fill="#475569">Customer</text>
  <text x="460" y="462" font-family="Inter, Arial" font-size="10" fill="#475569">Amount</text>
  <text x="560" y="462" font-family="Inter, Arial" font-size="10" fill="#475569">Status</text>
  <!-- Rows: barely distinguishable from headers -->
  <text x="252" y="484" font-family="Inter, Arial" font-size="10" fill="#64748b">#4521</text>
  <text x="300" y="484" font-family="Inter, Arial" font-size="10" fill="#64748b">Acme Corp</text>
  <text x="460" y="484" font-family="Inter, Arial" font-size="10" fill="#64748b">$2,400</text>
  <text x="560" y="484" font-family="Inter, Arial" font-size="10" fill="#22c55e">Paid</text>
  <text x="252" y="504" font-family="Inter, Arial" font-size="10" fill="#64748b">#4520</text>
  <text x="300" y="504" font-family="Inter, Arial" font-size="10" fill="#64748b">Beta Industries</text>
  <text x="460" y="504" font-family="Inter, Arial" font-size="10" fill="#64748b">$850</text>
  <text x="560" y="504" font-family="Inter, Arial" font-size="10" fill="#f59e0b">Pending</text>
  <text x="252" y="524" font-family="Inter, Arial" font-size="10" fill="#64748b">#4519</text>
  <text x="300" y="524" font-family="Inter, Arial" font-size="10" fill="#64748b">Gamma LLC</text>
  <text x="460" y="524" font-family="Inter, Arial" font-size="10" fill="#64748b">$5,200</text>
  <text x="560" y="524" font-family="Inter, Arial" font-size="10" fill="#ef4444">Overdue</text>
  <text x="252" y="560" font-family="Inter, Arial" font-size="10" fill="#6366f1">View all transactions →</text>
