  <!-- Notification bell + avatar: low contrast -->
  <circle cx="750" cy="28" r="14" fill="#1e293b"/>
  <text x="750" y="33" font-family="Arial" font-size="13" fill="#334155" text-anchor="middle">🔔</text>
  <circle cx="720" cy="28" r="14" fill="#334155"/>
  <text x="720" y="33" font-family="Arial" font-size="11" fill="#475569" text-anchor="middle">TD</text>
