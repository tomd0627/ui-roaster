<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Startup landing page: hero worship, no substance -->
  <defs>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#hero)"/>
  <!-- Nav -->
  <rect width="800" height="64" fill="rgba(0,0,0,0.2)"/>
  <circle cx="32" cy="32" r="14" fill="white" opacity="0.9"/>
  <text x="55" y="38" font-family="Arial" font-size="18" fill="white" font-weight="bold">synergize.io</text>
  <text x="560" y="38" font-family="Arial" font-size="14" fill="white">Product</text>
  <text x="620" y="38" font-family="Arial" font-size="14" fill="white">Pricing</text>
  <text x="670" y="38" font-family="Arial" font-size="14" fill="white">Blog</text>
  <rect x="710" y="18" width="70" height="28" rx="14" fill="white"/>
  <text x="722" y="36" font-family="Arial" font-size="12" fill="#667eea" font-weight="bold">Sign Up</text>
  <!-- Hero section: enormous, content-free -->
  <text x="400" y="200" font-family="Arial" font-size="48" fill="white" font-weight="bold" text-anchor="middle">Revolutionize</text>
  <text x="400" y="250" font-family="Arial" font-size="48" fill="white" font-weight="bold" text-anchor="middle">Your Workflow</text>
  <!-- Buzzword soup -->
  <text x="400" y="295" font-family="Arial" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">The AI-powered, blockchain-enabled, cloud-native platform</text>
  <text x="400" y="315" font-family="Arial" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">for next-generation synergistic business transformation.</text>
  <!-- CTA buttons: poor hierarchy, similar weight -->
  <rect x="270" y="345" width="120" height="44" rx="22" fill="white"/>
  <text x="330" y="372" font-family="Arial" font-size="14" fill="#667eea" font-weight="bold" text-anchor="middle">Get Started</text>
  <rect x="410" y="345" width="120" height="44" rx="22" fill="rgba(255,255,255,0.2)" stroke="white"/>
  <text x="470" y="372" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Learn More</text>
  <!-- Stock photo placeholder -->
  <rect x="150" y="410" width="500" height="160" rx="12" fill="rgba(0,0,0,0.25)"/>
  <text x="400" y="490" font-family="Arial" font-size="18" fill="rgba(255,255,255,0.5)" text-anchor="middle">[Hero Image: Stock photo of laptop + coffee]</text>
  <text x="400" y="515" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.3)" text-anchor="middle">Person smiling at generic graph going up and to the right</text>
  <!-- Social proof that proves nothing -->
  <text x="400" y="575" font-family="Arial" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">Trusted by 10,000+ teams worldwide · 4.9★ on G2 · Forbes "Next Big Thing" 2021</text>
</svg>
